#-*- coding: utf-8-unix -*-

# Pool connecting to node-app instance 1
quarkus.ironjacamar.casual.ra.kind=casual
quarkus.ironjacamar.casual.ra.config.host=localhost
quarkus.ironjacamar.casual.ra.config.port=7771
quarkus.ironjacamar.casual.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.casual.ra.config.network-connection-pool-name=node-one-pool
quarkus.ironjacamar.casual.ra.config.inbound-server-port=7780

# Pool connecting to node-app instance 2
quarkus.ironjacamar.node-two.ra.kind=casual
quarkus.ironjacamar.node-two.ra.config.host=localhost
quarkus.ironjacamar.node-two.ra.config.port=7772
quarkus.ironjacamar.node-two.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.node-two.ra.config.network-connection-pool-name=node-two-pool

# Pool sizes for soak testing
quarkus.ironjacamar.casual.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.initial-size=5000

quarkus.ironjacamar.node-two.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.node-two.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.node-two.ra.cm.pool.config.initial-size=5000

# Packaging
quarkus.package.jar.type=uber-jar

# Virtual threads for throughput
quarkus.virtual-threads.enabled=true

# http
quarkus.shutdown.timeout=5s

# Logging - suppress noisy JCA connection manager warnings
quarkus.log.category."org.jboss.jca.core.connectionmanager".level=ERROR
