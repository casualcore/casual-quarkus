//-*- coding: utf-8-unix -*-
pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name='casual-quarkus-example'

include 'example-app'
include 'front-app'
include 'node-app'
include 'db-app'
include 'user-handlers'
include 'json-buffer-handler'
