#-*- coding: utf-8-unix -*-

quarkus.http.port=8081

# Pool connecting to db-app
quarkus.ironjacamar.casual.ra.kind=casual
quarkus.ironjacamar.casual.ra.config.host=localhost
quarkus.ironjacamar.casual.ra.config.port=7773
quarkus.ironjacamar.casual.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.casual.ra.config.network-connection-pool-name=db-pool
quarkus.ironjacamar.casual.ra.config.inbound-server-port=7771

# Pool sizes for soak testing
quarkus.ironjacamar.casual.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.initial-size=5000

# Second instance profile
%two.quarkus.http.port=8082
%two.quarkus.ironjacamar.casual.ra.config.inbound-server-port=7772

# Reverse profile - the db pool is backed by the reverse pool from the reverse outbound
# configured in casual-config-node-{one,two}-reverse.json, the db-app connects to us.
# host/port are unused for reverse pools but must be set. Combine with the second
# instance profile as QUARKUS_PROFILE=reverse,two
%reverse.quarkus.ironjacamar.casual.ra.config.host=reverse
%reverse.quarkus.ironjacamar.casual.ra.config.port=0
%reverse.quarkus.ironjacamar.casual.ra.config.network-connection-pool-name=db
# no prefill - prefill creates unpinned managed connections and casual-caller only ever requests pinned ones
%reverse.quarkus.ironjacamar.casual.ra.cm.pool.config.min-size=0
%reverse.quarkus.ironjacamar.casual.ra.cm.pool.config.initial-size=0

# Packaging
quarkus.package.jar.type=uber-jar

# Virtual threads for throughput
quarkus.virtual-threads.enabled=true

# http
quarkus.shutdown.timeout=5s

# Logging - suppress noisy JCA connection manager warnings
quarkus.log.category."org.jboss.jca.core.connectionmanager".level=ERROR
