# if you want to fat jar your application
quarkus.package.jar.type=uber-jar

# we do not want calls to block a whole thread - very important for throughput
quarkus.virtual-threads.enabled=true

#casual.validation.interval=60s

# Graceful shutdown — delay gives remote TMs time to complete 2PC before teardown
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=30s
quarkus.shutdown.timeout=30s

# netty
#quarkus.jvm.args=-Dio.netty.tryReflectionSetAccessible=true

# for soak testing
quarkus.ironjacamar.casual.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.casual.ra.cm.pool.config.initial-size=5000

quarkus.ironjacamar.casual-two.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.casual-two.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.casual-two.ra.cm.pool.config.initial-size=5000

quarkus.ironjacamar.casual-three.ra.cm.pool.config.min-size=5000
quarkus.ironjacamar.casual-three.ra.cm.pool.config.max-size=5000
quarkus.ironjacamar.casual-three.ra.cm.pool.config.initial-size=5000

quarkus.thread-pool.max-threads=200

# logging
# IMPORTANT: we do not want noisy warnings that connections are gone casual caller handles that
quarkus.log.category."org.jboss.jca.core.connectionmanager".level=ERROR
#se.laz.casual.connection.caller=TRACE

#quarkus.log.category."io.netty".level=TRACE
#quarkus.log.category."io.netty".min-level=TRACE

#quarkus.log.category."se.laz.casual".level=TRACE
#quarkus.log.category."se.laz.casual".min-level=TRACE

# Also raise the global minimum level so TRACE messages are not filtered out at build time
#quarkus.log.min-level=TRACE

# Optional: Raise the console handler level as well (recommended in dev mode)
#quarkus.log.console.level=TRACE
