quarkus.ironjacamar.casual.ra.kind=casual
quarkus.ironjacamar.casual.ra.config.host=localhost
quarkus.ironjacamar.casual.ra.config.port=7781
quarkus.ironjacamar.casual.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.casual.ra.config.network-connection-pool-name=casual-pool
quarkus.ironjacamar.casual.ra.config.inbound-server-port=7772

quarkus.ironjacamar.casual-two.ra.kind=casual
quarkus.ironjacamar.casual-two.ra.config.host=localhost
quarkus.ironjacamar.casual-two.ra.config.port=7791
quarkus.ironjacamar.casual-two.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.casual-two.ra.config.network-connection-pool-name=casual-two-pool
quarkus.ironjacamar.casual-two.ra.config.inbound-server-port=7772

# overrides for other profiles
%peer.quarkus.http.port=8000
$peer.quarkus.debug.port=5006
%peer.quarkus.ironjacamar.casual.ra.config.port=7782
%peer.quarkus.ironjacamar.casual.ra.config.inbound-server-port=7781

%other.quarkus.http.port=8100
$other.quarkus.debug.port=5010
%other.quarkus.ironjacamar.casual.ra.config.port=7792
%other.quarkus.ironjacamar.casual.ra.config.inbound-server-port=7791

